name: Cross Compile

# Cross-compiles the Rust/ashpd extension into precompiled, per-platform
# native gems and uploads them as build artifacts. This does NOT publish to
# RubyGems — releasing is a manual step you perform with the built gems.
#
# When users install a published precompiled gem, RubyGems serves the one
# matching their platform (the .so is already inside), so they need no Rust.

on:
  push:
    branches: [main]
    paths:
      - 'ext/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'ashpd.gemspec'
      - 'Rakefile'
      - '.github/workflows/cross-compile.yml'
      # The loader and the version live here, and the version is what the platform gems are
      # built as, so a bump has to rebuild them.
      - 'lib/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-data:
    name: Fetch the supported platforms and Ruby versions
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.fetch.outputs.result }}
    steps:
      - uses: oxidize-rb/actions/fetch-ci-data@v1
        id: fetch
        with:
          supported-ruby-platforms: true
          stable-ruby-versions: |
            exclude: [head]

  cross-gem:
    name: Compile native gem for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    needs: ci-data
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.ci-data.outputs.result).supported-ruby-platforms }}
        # Windows is excluded, and not for a toolchain reason: ashpd cannot be
        # built for it at all. The crate imports `std::os::fd` and
        # `zbus::zvariant::Fd`, which exist only on Unix, because the portal
        # interfaces pass file descriptors over D-Bus -- `OpenURI.OpenFile`
        # takes an fd, not a path. A Windows build fails in the dependency with
        # 15 errors of the form `unresolved import std::os::fd`, which is
        # upstream telling us the XDG desktop portals are a Linux desktop
        # protocol. There is no Windows gem to ship here.
        #
        # x64-mingw32 is additionally the legacy toolchain used only by
        # Ruby <= 3.0; we require >= 3.3, so rake-compiler never registers a
        # native:x64-mingw32 task and that job would fail regardless.
        exclude:
          - platform: x64-mingw32
          - platform: x64-mingw-ucrt
          - platform: aarch64-mingw-ucrt
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - uses: oxidize-rb/actions/cross-gem@v1
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: ${{ join(fromJSON(needs.ci-data.outputs.result).stable-ruby-versions, ',') }}

      - uses: actions/upload-artifact@v4
        with:
          name: cross-gem-${{ matrix.platform }}
          path: ${{ steps.cross-gem.outputs.gem-path }}
          if-no-files-found: error
